name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, "engineering/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prototype-contract:
    name: Prototype contract tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Verify runtime
        run: node --version

      - name: Run repository tests
        run: npm test
