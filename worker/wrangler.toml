name = "chavruta-preview"
main = "index.js"
compatibility_date = "2026-11-06"
compatibility_flags = ["nodejs_compat"]

# Gated real-Firebase acceptance build. Public opening awaits owner sign-in verification.
[vars]
PREVIEW_MODE = "private-firebase"
# Synthetic demo entry for THIS gated preview only (scrypt exceeds the Workers
# Free 10ms CPU limit, so real register/login cannot run on the free runtime).
# The route exists only when this is 'true' AND auth mode is not 'neon'.
# REMOVE for any production deployment.
PREVIEW_DEMO_MODE = "false"
AUTH_MODE = "firebase"
FIREBASE_SIGNIN_ENABLED = "true"

# run_worker_first: without it, requests matching a static file are served by
# the assets layer BEFORE the worker runs - which would bypass the preview
# gate on every public file. The worker must gate first, then fetch assets.
[assets]
directory = "../app/dist"
binding = "ASSETS"
run_worker_first = true

# Hyperdrive -> existing Neon chavruta-dev branch. Config IDs are filled at
# deploy time (wrangler hyperdrive create), after the account exists.
# chavruta_app role (least privilege, no BYPASSRLS) for all user traffic.
[[hyperdrive]]
binding = "HYPERDRIVE_APP"
id = "4fafd84309384206bcea1d504a69bda0"
localConnectionString = "postgresql://postgres:localdev@127.0.0.1:5432/chavruta_dev"
# neondb_owner, used only for bootstrap/binding writes (service-role mirror).
[[hyperdrive]]
binding = "HYPERDRIVE_ADMIN"
id = "780c7e8adff24094ad2ff1c6117d7200"
localConnectionString = "postgresql://postgres:localdev@127.0.0.1:5432/chavruta_dev"

# Per-invocation logs (incl. per-route CPU time) for preview verification.
[observability]
enabled = true
