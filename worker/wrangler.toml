name = "chavruta-preview"
main = "index.js"
compatibility_date = "2026-11-06"
compatibility_flags = ["nodejs_compat"]

# Private preview: fail-closed app-level gate (PREVIEW_GATE_KEY secret),
# synthetic dev-auth accounts only, Google sign-in disabled at the API layer.
[vars]
PREVIEW_MODE = "private-synthetic"

# run_worker_first: without it, requests matching a static file are served by
# the assets layer BEFORE the worker runs - which would bypass the preview
# gate on every public file. The worker must gate first, then fetch assets.
[assets]
directory = "../app/dist"
binding = "ASSETS"
run_worker_first = true

# Hyperdrive -> existing Neon chavruta-dev branch. Config IDs are filled at
# deploy time (wrangler hyperdrive create), after the account exists.
# chavruta_app role (least privilege, no BYPASSRLS) for all user traffic.
[[hyperdrive]]
binding = "HYPERDRIVE_APP"
id = "00000000000000000000000000000001"
localConnectionString = "postgresql://postgres:localdev@127.0.0.1:5432/chavruta_dev"
# neondb_owner, used only for bootstrap/binding writes (service-role mirror).
[[hyperdrive]]
binding = "HYPERDRIVE_ADMIN"
id = "00000000000000000000000000000002"
localConnectionString = "postgresql://postgres:localdev@127.0.0.1:5432/chavruta_dev"
